name: Test Suite

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        rust_version: [stable]
        build_flags: ["", "--features double-precision", "--features object-layer-u32", "--all-features"]
        include:
          - os: ubuntu-latest
            container: rust:slim-trixie

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    name: Tests - ${{ matrix.os }} ${{ matrix.rust_version }} ${{ matrix.build_flags }}

    steps:
    - name: Install C/C++ build deps
      if: runner.os == 'Linux'
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends \
          git cmake ninja-build clang libclang-dev

    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust_version }}

    - uses: swatinem/rust-cache@v2

    - name: Rust Tests
      run: cargo test --verbose --workspace ${{ matrix.build_flags }}

  rustfmt:
    runs-on: ubuntu-latest
    container: rust:slim-trixie
    name: Code Formatting

    steps:
    - name: Install git
      run: apt-get update -qq && apt-get install -y --no-install-recommends git

    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt

    - name: Rustfmt
      run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    container: rust:slim-trixie
    name: Clippy

    steps:
    - name: Install C/C++ build deps
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends \
          git cmake ninja-build clang libclang-dev

    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: clippy

    - uses: swatinem/rust-cache@v2

    - name: Clippy
      run: cargo clippy --workspace --all-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    container: rust:slim-trixie
    name: Docs

    steps:
    - name: Install C/C++ build deps
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends \
          git cmake ninja-build clang libclang-dev

    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable

    - uses: swatinem/rust-cache@v2

    - name: Doc
      run: cargo doc --no-deps --all-features
      env:
        RUSTDOCFLAGS: -D warnings
