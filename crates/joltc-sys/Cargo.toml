[package]
name = "joltc-sys"
description = "Unsafe bindings to Jolt Physics using JoltC"
version = "0.3.1+Jolt-5.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/5unekku/jolt-rust"
edition = "2021"

exclude = ["JoltC/JoltPhysics/Assets", "JoltC/JoltPhysics/TestFramework", "JoltC/JoltPhysics/Samples", "JoltC/JoltPhysics/UnitTests"]

[features]
default = []

# Enable Jolt's debug assertions
asserts = []

# Changes all world coordinates to use f64 instead of 32 coordinates.
double-precision = []

# Changes ObjectLayer and related types to be u32 instead of u16.
object-layer-u32 = []

# Pins floating-point flags to the cross-platform-deterministic settings JPH
# gates on its CROSS_PLATFORM_DETERMINISTIC CMake variable. Required for
# P2P-deterministic netcode and rollback-replayable simulations. Default-off;
# ~10% perf cost. Mirrors rapier3d's `enhanced-determinism` feature.
cross-platform-deterministic = []

[dependencies]

[build-dependencies]
bindgen = "0.69.1"
cmake = "0.1.50"
walkdir = "2.5.0"
anyhow = "1.0.69"

[dev-dependencies]
rand = "0.8.5"
